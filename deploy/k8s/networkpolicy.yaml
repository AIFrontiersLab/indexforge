apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reranking-gateway-ingress
  namespace: reranking-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: reranking-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: gateway}
      ports: [{port: 8080}]
