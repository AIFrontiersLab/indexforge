<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
<rect width="100%" height="100%" fill="#FAF7F0"/>
<text x="56" y="64" fill="#1A4BFF" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">AI FRONTIERS FORUM</text>
<text x="56" y="120" fill="#0B1F3A" font-size="42" font-family="Arial, Helvetica, sans-serif" font-weight="700">Reranking Gateway</text>
<text x="56" y="168" fill="#5A6B7D" font-size="22" font-family="Arial, Helvetica, sans-serif">One concept. Three AI perspectives. One tested architecture.</text>
<rect x="48.0" y="280.0" width="452.0" height="220.0" rx="16" fill="#FFFFFF" stroke="#1A4BFF" stroke-width="3"/>
<text x="68.0" y="320.0" fill="#1A4BFF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Gateway Controller</text>
<text x="68.0" y="358.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Entry point for reranking requests.</text>
<text x="68.0" y="384.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Validates input schema and</text>
<text x="68.0" y="410.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">orchestrates the flow.</text>
<rect x="524.0" y="280.0" width="452.0" height="220.0" rx="16" fill="#FFFFFF" stroke="#1A4BFF" stroke-width="3"/>
<text x="544.0" y="320.0" fill="#1A4BFF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Reranker Engine</text>
<text x="544.0" y="358.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Core logic. Loads the cross-encoder</text>
<text x="544.0" y="384.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">model. Computes relevance scores for</text>
<text x="544.0" y="410.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">each (query, document) pair.</text>
<rect x="48.0" y="524.0" width="452.0" height="220.0" rx="16" fill="#FFFFFF" stroke="#1A4BFF" stroke-width="3"/>
<text x="68.0" y="564.0" fill="#1A4BFF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Fallback Handler</text>
<text x="68.0" y="602.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Ensures system resilience. If the</text>
<text x="68.0" y="628.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Reranker Engine fails or times out,</text>
<text x="68.0" y="654.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">it returns the original vector</text>
<text x="68.0" y="680.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">search order (or a lightweight</text>
<text x="68.0" y="706.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">lexical match) to prevent pipeline</text>
<rect x="524.0" y="524.0" width="452.0" height="220.0" rx="16" fill="#FFFFFF" stroke="#1A4BFF" stroke-width="3"/>
<text x="544.0" y="564.0" fill="#1A4BFF" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Metrics Collector</text>
<text x="544.0" y="602.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">Logs latency, throughput, and</text>
<text x="544.0" y="628.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">reranking score distributions for</text>
<text x="544.0" y="654.0" fill="#0B1F3A" font-size="18" font-family="Arial, Helvetica, sans-serif">observability.</text>
<text x="56" y="1496" fill="#5A6B7D" font-size="16" font-family="Arial, Helvetica, sans-serif">For more AI learning, register free:  https://aifrontiersforum.org/join</text>
</svg>
